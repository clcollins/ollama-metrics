# Reference copy of the Prometheus configuration.
# The canonical config is embedded in the ConfigMap in monitoring.yaml.
#
# As configured, this file is for use inside the monitoring pod where
# node-exporter is at localhost:9100 and ollama-metrics is reachable
# via the host (host.containers.internal).
#
# Adjust targets for your deployment:
#   - host.containers.internal:8080 — ollama-metrics published to host
#   - localhost:8080 — ollama-metrics in the same pod as Prometheus
#   - <pod-ip>:8080 — ollama-metrics in a different pod
global:
  scrape_interval: 1m

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'ollama'
    scrape_interval: 15s
    static_configs:
      - targets: ['host.containers.internal:8080']
