name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: "1.24"
  CI_IMAGE: ollama-metrics-ci
  IMAGE_NAME: quay.io/clcollins/ollama-metrics

jobs:
  # --- CI container ---

  ci-image:
    name: Build CI Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CI container
        run: podman build -f test/Containerfile.ci -t ${CI_IMAGE} test/

      - name: Save CI container image
        run: podman save ${CI_IMAGE} -o /tmp/${CI_IMAGE}.tar

      - name: Upload CI container image
        uses: actions/upload-artifact@v4
        with:
          name: ci-image
          path: /tmp/${{ env.CI_IMAGE }}.tar
          retention-days: 1

  # --- Lint jobs (run inside CI container) ---

  yaml-lint:
    name: YAML Lint
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${CI_IMAGE}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${CI_IMAGE} make yaml-lint

  markdown-lint:
    name: Markdown Lint
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${CI_IMAGE}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${CI_IMAGE} make markdown-lint

  makefile-lint:
    name: Makefile Lint
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${CI_IMAGE}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${CI_IMAGE} make makefile-lint

  containerfile-check:
    name: Containerfile Check
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${CI_IMAGE}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${CI_IMAGE} make containerfile-check

  kubernetes-validate:
    name: Kubernetes Manifest Validation
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${CI_IMAGE}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${CI_IMAGE} make kubernetes-validate

  shellcheck-lint:
    name: ShellCheck
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${CI_IMAGE}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${CI_IMAGE} make shellcheck-lint

  docs-check:
    name: Documentation Check
    needs: ci-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-image
          path: /tmp
      - run: podman load -i /tmp/${CI_IMAGE}.tar
      - run: podman run --rm -v "$(pwd):/work:Z" ${CI_IMAGE} make docs-check

  # --- Go jobs (run on GHA runner) ---

  fmt:
    name: Go Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run go vet
        run: go vet ./...

  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests with race detector
        run: go test -v -count=1 -race ./...
      - name: Run tests with coverage
        run: go test -coverprofile=coverage.txt -count=1 ./...
      - name: Upload results to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: mkdir -p out && go build -o out/ollama-metrics .

  tidy-check:
    name: Go Mod Tidy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if [ -n "$(git diff --name-only go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the changes."
            git diff go.mod go.sum
            exit 1
          fi

  # --- Container image build (run on GHA runner) ---

  image-build:
    name: Container Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: |
          podman build -f Containerfile \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg VCS_REF=$(git rev-parse HEAD) \
            --build-arg VERSION=ci \
            -t ${{ env.IMAGE_NAME }}:ci .
      - name: Validate OCI labels
        run: |
          echo "Checking OCI labels..."
          inspect=$(podman inspect ${{ env.IMAGE_NAME }}:ci)
          for label in \
            "org.opencontainers.image.title" \
            "org.opencontainers.image.revision" \
            "org.opencontainers.image.version" \
            "org.opencontainers.image.source" \
            "io.k8s.display-name"; do
            value=$(echo "${inspect}" | jq -r ".[0].Config.Labels[\"${label}\"]")
            if [ "${value}" = "null" ] || [ -z "${value}" ]; then
              echo "ERROR: Missing label: ${label}"
              exit 1
            fi
            echo "OK: ${label}=${value}"
          done
          echo "All OCI labels validated successfully."
      - name: Validate image runs
        run: podman run --rm ${{ env.IMAGE_NAME }}:ci &
